name: Build and Deploy Sources

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/as/*/package-lock.json

      - name: Setup Rust toolchains
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install source build toolchain
        run: |
          rustup toolchain install nightly-2025-06-01 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain nightly-2025-06-01

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            src/rust/**/target
          key: ${{ runner.os }}-cargo-v4-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v4-

      - name: Install current Aidoku CLI
        run: cargo +stable install --locked --git https://github.com/Aidoku/aidoku-rs aidoku-cli

      - name: Build source packages and both indexes
        env:
          RUSTUP_TOOLCHAIN: nightly-2025-06-01
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Validate output layout
        run: |
          test -s public/index.json
          test -s public/index.min.json
          test -s public/v2/index.min.json
          node scripts/build-indexes.mjs \
            public/v2/index.min.json \
            public/index.json \
            public/index.min.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-list
          path: public
          if-no-files-found: error
